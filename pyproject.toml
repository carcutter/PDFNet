[project]
name = "pdfnet"
version = "0.0.0"
description = "PDFNet fine-tuning environment"
requires-python = ">=3.10,<3.12"
dependencies = [
    # core
    "numpy>=1.21",
    "einops>=0.6",
    "Pillow>=9.1",                # < 9.1 lacks Image.Resampling used by recent torchvision
    "opencv-python",
    "tqdm",
    "matplotlib",
    "pyyaml",                     # YAML config loading in Finetune_PDFNet.py
    # ML stack — pinned to CUDA 12.8 wheels from the PyTorch cu128 index below.
    "torch>=2.7,<2.9",
    "torchvision>=0.22,<0.24",
    "timm>=0.6",
    "tensorboard",
    # data + utilities
    "gdown",                      # download_checkpoint.py
    "huggingface_hub",
    "GitPython",
    # demo / inference (gradio + loadimg only needed for demo.ipynb)
    "loadimg",
    "gradio",
    "gradio_imageslider",
]

[tool.uv]
# Hermetic env: torch + torchvision are pulled from the PyTorch cu128 index
# below (CUDA 12.8 wheels), not from PyPI's CPU-only torch. Do NOT pass
# `--system-site-packages` to `uv venv` or the host's cu13 torch will shadow
# these. `setup.sh` already creates the venv without that flag.

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
